
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Roots Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Polynomial Roots Calculator</h1>
        <p>Calculate roots of a quadratic equation</p>

        <h2>ax² + bx + c = 0</h2>

        <input type="number" id="a" placeholder="Enter coefficient a">
        <input type="number" id="b" placeholder="Enter coefficient b">
        <input type="number" id="c" placeholder="Enter coefficient c">

        <button onclick="calculateRoots()">Calculate Roots</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
